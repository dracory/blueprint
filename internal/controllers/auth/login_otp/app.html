<div id="app" class="min-h-screen d-flex flex-column">
    <!-- Navigation (Mini) -->
    <nav class="navbar navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="/">
                <i class="bi bi-shield-lock text-brand me-2"></i>
                <span>{{ appName }}</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container flex-grow-1 d-flex align-items-center justify-content-center p-4">
        <div style="max-width: 450px; width: 100%;">
            <div class="card login-card">
                <div class="card-header bg-light border-bottom p-5 text-center">
                    <div class="icon-circle">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <h1 class="h3 fw-bold text-dark mb-2">Sign in to {{ appName }}</h1>
                    <p class="text-muted mb-0">No password needed. We'll email you a code.</p>
                </div>

                <div class="card-body p-5">
                    <!-- Step 1: Request OTP -->
                    <div v-if="step === 1">
                        <form @submit.prevent="handleSendOtp">
                            <div class="mb-4">
                                <label for="email" class="form-label small fw-bold text-uppercase tracking-wider">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" id="email" v-model="email" class="form-control border-start-0 py-3" placeholder="you@example.com" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-brand w-100 py-3 fw-bold shadow-sm" :disabled="isLoading">
                                <span v-if="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                Send Login Code
                            </button>
                        </form>
                    </div>

                    <!-- Step 2: Verify OTP -->
                    <div v-else class="text-center">
                        <p class="small text-muted mb-4">
                            We've sent a 6-digit code to <br>
                            <span class="fw-bold text-dark">{{ email }}</span>
                        </p>
                        <form @submit.prevent="handleVerifyOtp">
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-uppercase tracking-wider">Verification Code</label>
                                <div class="row g-2">
                                    <div class="col" v-for="i in 6" :key="i">
                                        <input
                                            type="text"
                                            maxlength="1"
                                            inputmode="numeric"
                                            pattern="[0-9]*"
                                            class="form-control otp-input"
                                            v-model="otpDigits[i-1]"
                                            @input="handleOtpInput($event, i-1)"
                                            @keydown.delete="handleOtpDelete($event, i-1)"
                                            @paste="handleOtpPaste($event, i-1)"
                                            :ref="'otp' + (i-1)"
                                            required
                                        >
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-brand w-100 py-3 fw-bold shadow-sm mb-3" :disabled="isLoading">
                                <span v-if="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                Verify & Sign In
                            </button>
                            <button type="button" class="btn btn-link text-brand text-decoration-none small" @click="handleBack">
                                Change Email
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="/" class="text-brand text-decoration-none small fw-bold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Homepage
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-top py-4 text-center mt-auto">
        <div class="container small text-muted">
            &copy; {{ appName }}. Secure &amp; Privacy-First.
        </div>
    </footer>
</div>
