<div id="app" class="min-h-screen d-flex flex-column">
    <!-- Navigation (Mini) -->
    <nav class="navbar navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="/">
                <i class="bi bi-shield-lock text-brand me-2"></i>
                <span>{{ appName }}</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container flex-grow-1 d-flex align-items-center justify-content-center p-4">
        <div style="max-width: 450px; width: 100%;">
            <div class="card login-card">
                <div class="card-header bg-light border-bottom p-5 text-center">
                    <div class="icon-circle">
                        <i class="bi bi-person-plus"></i>
                    </div>
                    <h1 class="h3 fw-bold text-dark mb-2">Create your account</h1>
                    <p class="text-muted mb-0">Sign up for {{ appName }} in seconds.</p>
                </div>

                <div class="card-body p-5">
                    <form @submit.prevent="handleSubmit">
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label for="firstName" class="form-label small fw-bold text-uppercase tracking-wider">First Name</label>
                                <input type="text" id="firstName" v-model="firstName" class="form-control py-3" placeholder="Jane" autocomplete="given-name" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="lastName" class="form-label small fw-bold text-uppercase tracking-wider">Last Name</label>
                                <input type="text" id="lastName" v-model="lastName" class="form-control py-3" placeholder="Doe" autocomplete="family-name" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="email" class="form-label small fw-bold text-uppercase tracking-wider">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" id="email" v-model="email" class="form-control border-start-0 py-3" placeholder="you@example.com" autocomplete="username" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label small fw-bold text-uppercase tracking-wider">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" id="password" v-model="password" class="form-control border-start-0 py-3" placeholder="At least 8 characters" autocomplete="new-password" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="passwordConfirm" class="form-label small fw-bold text-uppercase tracking-wider">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                                <input type="password" id="passwordConfirm" v-model="passwordConfirm" class="form-control border-start-0 py-3" placeholder="Repeat your password" autocomplete="new-password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-brand w-100 py-3 fw-bold shadow-sm" :disabled="isLoading">
                            <span v-if="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            Create Account
                        </button>
                    </form>
                </div>
            </div>

            <div class="text-center mt-4">
                <a href="{{ loginUrl }}" class="text-brand text-decoration-none small fw-bold">
                    <i class="bi bi-arrow-left me-1"></i> Already have an account? Sign in
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-top py-4 text-center mt-auto">
        <div class="container small text-muted">
            &copy; {{ appName }}. Secure &amp; Privacy-First.
        </div>
    </footer>
</div>
